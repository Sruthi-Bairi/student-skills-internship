spring.application.name=ssims
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/ssims?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.name=SSIMSSESSION

ssims.cors.allowed-origin=http://localhost:5173
ssims.admin.email=admin@ssims.local
ssims.admin.password=${SSIMS_ADMIN_PASSWORD} 
 
 logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web.csrf=DEBUG