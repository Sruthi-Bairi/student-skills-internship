spring.application.name=ssims
server.port=8081

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.name=SSIMSSESSION

ssims.cors.allowed-origin=https://student-skills-internship-eg3ur7ga3-student-skill.vercel.app
ssims.admin.email=admin@ssims.local
ssims.admin.password=${SSIMS_ADMIN_PASSWORD} 
 
 logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web.csrf=DEBUG